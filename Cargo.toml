[package]
name = "simply_droplets"
version = "0.1.0"
edition = "2021"
authors = ["Simply Chris"]
description = "A 3D droplet-based granular synthesis audio plugin built with Rust and nih-plug"
license = "MIT"

# Build dynamic library for VST/CLAP plugin
[lib]
crate-type = ["cdylib"]

[[bin]]
name = "standalone"
required-features = ["standalone"]


[workspace]
members = ["xtask"]

[dependencies]
# Main NIH-plug framework
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", features = ["standalone"] }

# Webview GUI integration  
wry = "0.51"
winit = "0.30"
raw-window-handle = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Core dependencies for the plugin
rand = { version = "0.8", features = ["small_rng"] }
fastrand = "2.0"

[features]
standalone = []

[profile.release]
lto = "thin"
strip = "symbols"
