[package]
name = "simply_droplets"
version = "0.1.0"
edition = "2021"
authors = ["Simply Chris"]
description = "A 3D droplet-based granular synthesis audio plugin built with Rust and nih-plug"
license = "MIT"

# Build dynamic library for VST/CLAP plugin
[lib]
crate-type = ["cdylib"]



[workspace]
members = ["xtask"]

[dependencies]
# Main CLACK framework
clack-extensions = { git = "https://github.com/prokopyl/clack.git", version = "0.1.0", features = ["clack-plugin", "audio-ports", "gui", "note-ports", "params", "raw-window-handle_06", "state"] }
clack-plugin = { git = "https://github.com/prokopyl/clack.git" }
clap-wrapper = { git = "https://github.com/blepfx/clap-wrapper-rs" }

# GUI dependencies
wry = "0.51.2"
open = "5.3.2"

# Additional dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossbeam = "0.8.4"

# Logging (standardized with vst plugin)
log = "0.4"
simplelog = "0.12"

# Core dependencies for the plugin
rand = { version = "0.8", features = ["small_rng"] }
fastrand = "2.0"


[profile.release]
lto = "thin"
strip = "symbols"
