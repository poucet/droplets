[package]
name = "simply_droplets"
version = "0.1.0"
edition = "2021"
authors = ["Simply Chris"]
description = "An AI powered VST plugin that can control any parameter in your DAW."
license = "MIT"

# Build dynamic library for VST/CLAP plugin
# Also includes "rlib" for standalone binary to link against
[lib]
crate-type = ["cdylib", "rlib"]

# Standalone binary for debugging
[[bin]]
name = "droplets-standalone"
path = "src/bin/standalone.rs"
required-features = ["standalone"]



[workspace]
members = ["xtask"]

[dependencies]
# Main CLACK framework
clack-extensions = { git = "https://github.com/prokopyl/clack.git", version = "0.1.0", features = ["clack-plugin", "audio-ports", "gui", "note-ports", "params", "raw-window-handle_06", "state"] }
clack-plugin = { git = "https://github.com/prokopyl/clack.git" }
clap-wrapper = { git = "https://github.com/blepfx/clap-wrapper-rs" }

# GUI dependencies
wry = "0.51.2"
open = "5.3.2"

# Additional dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossbeam = "0.8.4"

# Logging (standardized with vst plugin)
log = "0.4"
simplelog = "0.12"

# Core dependencies for the plugin
fastrand = "2.0"

# MCP server for AI control
rmcp = { version = "0.9.1", features = ["server", "transport-streamable-http-server"] }
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros"] }
tokio-util = "0.7"
tower = "0.5"
http-body-util = "0.1"

# Lock-free ring buffer for audio thread communication
rtrb = "0.3"

# Lock-free atomic pointer swapping for audio-safe data sharing
arc-swap = "1.7"

# TypeScript type generation from Rust types
ts-rs = "10"

# WebSocket support for real-time UI updates
tokio-tungstenite = "0.24"
futures-util = "0.3"

[features]
default = []
dev-gui = []  # Enable GUI development tools and debugging
standalone = ["midir", "env_logger", "tao"]  # Standalone binary with MIDI output

[target.'cfg(not(target_os = "windows"))'.dependencies]
midir = { version = "0.10", optional = true }
env_logger = { version = "0.11", optional = true }
tao = { version = "0.31", optional = true }


[profile.release]
lto = "thin"
strip = "symbols"
