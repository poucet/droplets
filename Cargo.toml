[package]
name = "simply-droplets"
version = "0.1.0"
edition = "2021"
authors = ["Simply Chris"]
description = "A 3D droplet-based granular synthesis audio plugin built with Rust and nih-plug"
license = "MIT"

# Build dynamic library for VST/CLAP plugin
[lib]
crate-type = ["cdylib"]

[workspace]
members = ["xtask"]

[dependencies]
# Main NIH-plug framework
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", features = ["standalone"] }

# Iced GUI integration
nih_plug_iced = { git = "https://github.com/robbert-vdh/nih-plug.git" }

# Core dependencies for the plugin
atomic_float = "0.1"
rand = { version = "0.8", features = ["small_rng"] }

[features]
standalone = []

[profile.release]
lto = "thin"
strip = "symbols"
