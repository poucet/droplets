[env]
# ts-rs writes generated TypeScript bindings here. Without this, plain
# `cargo test` would dump them into `<crate>/bindings/` (ts-rs's default),
# diverging from what `cargo xtask gen_types` uses. Keep both paths in sync
# so the frontend always sees the latest types regardless of how tests ran.
TS_RS_EXPORT_DIR = { value = "frontend/src/types", relative = true }

[alias]
# Build and bundle commands
xtask = "run --package xtask --"
bundle = "run --package xtask -- build"
bundle-debug = "run --package xtask -- build --profile debug"
bundle-release = "run --package xtask -- build --profile release"
bundle-clap = "run --package xtask -- build --format clap"
bundle-vst3 = "run --package xtask -- build --format vst3"
bundle-clap-debug = "run --package xtask -- build --profile debug --format clap"
bundle-vst3-debug = "run --package xtask -- build --profile debug --format vst3"
bundle-clap-release = "run --package xtask -- build --profile release --format clap"
bundle-vst3-release = "run --package xtask -- build --profile release --format vst3"

# Run standalone binary
standalone = "run --bin droplets-standalone --features=standalone"
standalone-release = "run --bin droplets-standalone --release --features=standalone"

# Quick development aliases
dev = "build"
dev-release = "build --release"
bundle-dev-gui = "run --package xtask -- build --dev-gui"
bundle-dev-gui-debug = "run --package xtask -- build --profile debug --dev-gui"